services:
  # ============================================================================
  # 1. DATABASE TIER (MySQL 8.0)
  # Persistent multi-tenant database running isolated microservice schemas
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: shopsphere-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-bunny6281}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/docker/mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-bunny6281}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================================================
  # 2. INFRASTRUCTURE TIER
  # Spring Cloud Config Server & Eureka Service Registry
  # ============================================================================
  config-server:
    build:
      context: ./infrastructure/config-server
      dockerfile: Dockerfile
    container_name: shopsphere-config-server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: native
      CONFIG_REPO_PATH: file:/app/config-repository/
    volumes:
      - ./infrastructure/config-repository:/app/config-repository:ro
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  service-registry:
    build:
      context: ./infrastructure/service-registry
      dockerfile: Dockerfile
    container_name: shopsphere-service-registry
    restart: unless-stopped
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  # ============================================================================
  # 3. CORE BUSINESS SERVICES (Internal Network Only)
  # Microservices communicate via Docker DNS and register with Eureka
  # ============================================================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: shopsphere-auth-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-bunny6281}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-8f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-shopsphere-internal-service-secret-key-384}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:-http://zipkin:9411/api/v2/spans}
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    container_name: shopsphere-product-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-bunny6281}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-8f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-shopsphere-internal-service-secret-key-384}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:-http://zipkin:9411/api/v2/spans}
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  cart-service:
    build:
      context: ./services/cart-service
      dockerfile: Dockerfile
    container_name: shopsphere-cart-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-bunny6281}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-8f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-shopsphere-internal-service-secret-key-384}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:-http://zipkin:9411/api/v2/spans}
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: shopsphere-inventory-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-bunny6281}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-8f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-shopsphere-internal-service-secret-key-384}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:-http://zipkin:9411/api/v2/spans}
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: shopsphere-payment-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-bunny6281}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-8f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-shopsphere-internal-service-secret-key-384}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:-http://zipkin:9411/api/v2/spans}
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: shopsphere-order-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-bunny6281}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-8f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-shopsphere-internal-service-secret-key-384}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:-http://zipkin:9411/api/v2/spans}
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ============================================================================
  # 4. PERIMETER & ENTRY POINTS (Gateway & Frontend)
  # API Gateway routes external traffic and enforces perimeter security
  # Frontend serves built static React assets via high-performance Nginx
  # ============================================================================
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: shopsphere-api-gateway
    restart: unless-stopped
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-8f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-shopsphere-internal-service-secret-key-384}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopsphere-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ============================================================================
  # 5. OBSERVABILITY STACK (Prometheus, Grafana, Zipkin)
  # ============================================================================
  zipkin:
    image: openzipkin/zipkin:3.4.1
    container_name: shopsphere-zipkin
    restart: unless-stopped
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    networks:
      - shopsphere-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: shopsphere-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - shopsphere-network
    depends_on:
      - api-gateway

  grafana:
    image: grafana/grafana:11.2.0
    container_name: shopsphere-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - shopsphere-network
    depends_on:
      - prometheus

# ==============================================================================
# VOLUMES & NETWORKS
# ==============================================================================
volumes:
  mysql_data:
    name: shopsphere_mysql_data

networks:
  shopsphere-network:
    name: shopsphere_network
    driver: bridge
