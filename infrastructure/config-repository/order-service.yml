shopsphere:
  order:
    config-message: "Order Service configuration loaded from Config Server"

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shopsphere_order}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:bunny6281}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shopsphere_order}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    user: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:bunny6281}
    baseline-on-migrate: true
  cloud:
    openfeign:
      client:
        config:
          PRODUCT-SERVICE:
            connectTimeout: 2000
            readTimeout: 3000
          CART-SERVICE:
            connectTimeout: 2000
            readTimeout: 3000
          INVENTORY-SERVICE:
            connectTimeout: 2000
            readTimeout: 3000
          PAYMENT-SERVICE:
            connectTimeout: 2000
            readTimeout: 3000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      order-product:
        baseConfig: default
      order-cart:
        baseConfig: default
      order-inventory:
        baseConfig: default
      order-payment:
        baseConfig: default

  retry:
    instances:
      order-product:
        baseConfig: default
        retryExceptions:
          - feign.RetryableException
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - java.io.IOException
        ignoreExceptions:
          - com.shopsphere.order.exception.ProductNotFoundException
          - com.shopsphere.order.exception.ProductUnavailableException
          - feign.FeignException.NotFound
          - feign.FeignException.BadRequest
          - feign.FeignException.Forbidden
          - feign.FeignException.Unauthorized
      order-cart:
        maxAttempts: 2
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - feign.RetryableException
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - java.io.IOException
        ignoreExceptions:
          - feign.FeignException.NotFound
          - feign.FeignException.BadRequest
          - feign.FeignException.Forbidden
          - feign.FeignException.Unauthorized
      order-inventory-idempotent:
        maxAttempts: 2
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - feign.RetryableException
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - java.io.IOException
      order-payment-query:
        maxAttempts: 2
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - feign.RetryableException
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - java.io.IOException
        ignoreExceptions:
          - feign.FeignException.NotFound
