      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: shopsphere-order-service-prod
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${ORDER_DB_USER:-order_user}
      DB_PASSWORD: ${ORDER_DB_PASS:-order_pass_shopsphere}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-8f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-shopsphere-internal-service-secret-key-384}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - shopsphere-prod-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 640M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ============================================================================
  # 5. PERIMETER GATEWAY & FRONTEND (Private Network Only)
  # Reachable exclusively via the Nginx Reverse Proxy
  # ============================================================================
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: shopsphere-api-gateway-prod
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-8f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-shopsphere-internal-service-secret-key-384}
      JAVA_OPTS: "-Xms192m -Xmx384m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - shopsphere-prod-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopsphere-frontend-prod
    restart: always
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - shopsphere-prod-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # 6. OBSERVABILITY (Private Network Only)
  # Accessible securely via SSH port forwarding
  # ============================================================================
  zipkin:
    image: openzipkin/zipkin:3.4.1
    container_name: shopsphere-zipkin-prod
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseG1GC"
    networks:
      - shopsphere-prod-network
    deploy:
      resources:
        limits:
          memory: 384M

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: shopsphere-prometheus-prod
    restart: unless-stopped
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - shopsphere-prod-network
    depends_on:
      - api-gateway
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:11.2.0
    container_name: shopsphere-grafana-prod
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - shopsphere-prod-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M

# ==============================================================================
# PERSISTENT VOLUMES & ISOLATED NETWORK
# ==============================================================================
volumes:
  mysql_prod_data:
    name: shopsphere_mysql_prod_data

networks:
  shopsphere-prod-network:
    name: shopsphere_prod_network
    driver: bridge
