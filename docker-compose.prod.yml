services:
  # ============================================================================
  # 1. PUBLIC INGRESS & TLS REVERSE PROXY (Only Port 80 & 443 are Exposed)
  # Mediates all external internet traffic, handles HTTPS and Let's Encrypt
  # ============================================================================
  nginx-proxy:
    build:
      context: ./infrastructure/docker/nginx-ssl
      dockerfile: Dockerfile
    container_name: shopsphere-nginx-proxy
    restart: always
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx-ssl/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - shopsphere-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: shopsphere-certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"
    networks:
      - shopsphere-prod-network

  # ============================================================================
  # 2. PERSISTENT DATABASE TIER (Private Network Only - Port 3306 NOT Exposed)
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: shopsphere-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-bunny6281}
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./infrastructure/docker/mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - shopsphere-prod-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-bunny6281}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # 3. SPRING CLOUD INFRASTRUCTURE (Private Network Only)
  # ============================================================================
  config-server:
    build:
      context: ./infrastructure/config-server
      dockerfile: Dockerfile
    container_name: shopsphere-config-server-prod
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: native
      CONFIG_REPO_PATH: file:/app/config-repository/
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
    volumes:
      - ./infrastructure/config-repository:/app/config-repository:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shopsphere-prod-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  service-registry:
    build:
      context: ./infrastructure/service-registry
      dockerfile: Dockerfile
    container_name: shopsphere-service-registry-prod
    restart: always
    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - shopsphere-prod-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ============================================================================
  # 4. CORE BUSINESS MICROSERVICES (Private Network Only)
  # ============================================================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: shopsphere-auth-service-prod
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${AUTH_DB_USER:-auth_user}
      DB_PASSWORD: ${AUTH_DB_PASS:-auth_pass_shopsphere}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-8f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-shopsphere-internal-service-secret-key-384}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_OPTS: "-Xms192m -Xmx384m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - shopsphere-prod-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  product-service:
