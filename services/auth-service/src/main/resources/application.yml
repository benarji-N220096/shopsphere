server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    preferIpAddress: true

shopsphere:
  security:
    jwt:
      secret: ${JWT_SECRET:8f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a1b9c8e4d3f2a}
      expiration-ms: 3600000
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:your_google_client_id_here}
      client-secret: ${GOOGLE_CLIENT_SECRET:your_google_client_secret_here}
